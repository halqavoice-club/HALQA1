name: HALQA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend Unit Tests ─────────────────────────────────────────────────────
  # DO-003: Run the financial unit tests (auth/stripe/gift/wallet) on every PR.
  # These tests mock all external deps — no real DB or Redis needed.
  # They protect the most critical code paths: payment, auth, gifting.
  backend-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run unit tests (auth + stripe + gift + wallet)
        run: npm run test:unit -- --ci --reporters=default
        working-directory: backend
        env:
          NODE_ENV: test
          # Jest setup file sets all required env vars, but CI needs
          # DATABASE_URL to satisfy validateEnv (not actually connected)
          DATABASE_URL: 'mysql://root:test@localhost:3306/halqa_test'
          JWT_SECRET: 'ci_jwt_secret_at_least_32_characters_!!'
          JWT_REFRESH_SECRET: 'ci_refresh_secret_at_least_32_chars_!!'
          PORT: '5001'
          SERVICE_NAME: 'halqa-ci'

  # ─── Backend Lint + Schema Validate ────────────────────────────────────────
  backend:
    name: Backend — Lint & Schema
    runs-on: ubuntu-latest
    # Run in parallel with unit tests — both are fast and independent
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://root:password@localhost:3306/halqa_test'

      - name: Check for syntax errors
        run: node -e "
          const files = require('fs').readdirSync('./src', { recursive: true })
            .filter(f => f.endsWith('.js'))
            .map(f => './src/' + f);
          let ok = 0, fail = 0;
          files.forEach(f => {
            try { require(f); ok++; }
            catch(e) { if (!e.message.includes('Cannot find module')) { console.error('FAIL:', f, e.message); fail++; } else ok++; }
          });
          console.log('Syntax check:', ok, 'OK,', fail, 'FAIL');
          if (fail > 0) process.exit(1);
        "
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://root:password@localhost:3306/halqa_test'
          JWT_SECRET: 'test_secret_for_ci_only'
          JWT_REFRESH_SECRET: 'test_refresh_secret_for_ci_only'
          PORT: '5001'

  # ─── Frontend Type Check + Lint ────────────────────────────────────────────
  frontend:
    name: Frontend — TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

  # ─── Mobile Type Check + Lint ──────────────────────────────────────────────
  mobile:
    name: Mobile — TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: mobile

      - name: ESLint
        run: npm run lint
        working-directory: mobile

  # ─── Backend Integration Tests ─────────────────────────────────────────────
  # REQ-19.3, REQ-20.9: Run integration tests against a real MySQL + Redis.
  # Runs after backend lint and unit tests both pass.
  # Blocks the Docker build if any integration test fails.
  backend-integration:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, backend-tests]

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: halqa_test
          MYSQL_USER: halqa
          MYSQL_PASSWORD: halqa_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Prisma migrations against test DB
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'

      - name: Run integration tests
        run: npm run test:integration -- --ci
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'
          REDIS_URL: 'redis://localhost:6379'
          JWT_SECRET: 'ci_integration_jwt_secret_at_least_32_chars!!'
          JWT_REFRESH_SECRET: 'ci_integration_refresh_secret_32_chars!!'
          PORT: '5002'
          SERVICE_NAME: 'halqa-integration-ci'

  # ─── Docker Build Test ─────────────────────────────────────────────────────
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    # DO-003: Docker build only runs after lint, unit tests, AND integration tests pass
    needs: [backend, backend-tests, backend-integration, frontend]
    # Only run on main branch or PRs to main (not on every push to develop)
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t halqa-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t halqa-frontend:test ./frontend
        env:
          NEXT_PUBLIC_API_URL: 'https://api.halqa.app/api/v1'
          NEXT_PUBLIC_SOCKET_URL: 'https://api.halqa.app'
          NEXT_PUBLIC_LIVEKIT_URL: 'wss://placeholder.livekit.cloud'
