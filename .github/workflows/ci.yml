name: HALQA CI

on:
  push:
    branches: [main, develop, fix/live-class-gap-analysis]
  pull_request:
    branches: [main, develop, fix/live-class-gap-analysis]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual CI run'
