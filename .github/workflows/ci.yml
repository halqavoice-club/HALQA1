name: HALQA CI

on:
  push:
    branches: [main, develop, fix/live-class-gap-analysis]
  pull_request:
    branches: [main, develop, fix/live-class-gap-analysis]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual CI run'

jobs:
  # â”€â”€â”€ Backend Unit Tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # DO-003: Run the financial unit tests (auth/stripe/gift/wallet) on every PR.
  # These tests mock all external deps â€” no real DB or Redis needed.
  # They protect the most critical code paths: payment, auth, gifting.
  backend-tests:
    name: Backend â€” Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run unit tests (all unit tests, excluding integration)
        run: npm run test:unit -- --ci --reporters=default
        working-directory: backend
        env:
          NODE_ENV: test
          # jest.setup.js sets all required env vars, but CI needs
          # DATABASE_URL to satisfy validateEnv (not actually connected)
          DATABASE_URL: 'mysql://root:test@localhost:3306/halqa_test'
          JWT_SECRET: 'ci_jwt_secret_at_least_32_characters_!!'
          JWT_REFRESH_SECRET: 'ci_refresh_secret_at_least_32_chars_!!'
          PORT: '5001'
          SERVICE_NAME: 'halqa-ci'
          # Sprint 7: HEALTH_TOKEN required for /health/detailed token gate tests
          HEALTH_TOKEN: 'ci_health_token_for_unit_tests_only_!!'
          # Sprint 7: METRICS_TOKEN required for metrics endpoint tests
          METRICS_TOKEN: 'ci_metrics_token_for_unit_tests_only_!!'

  # â”€â”€â”€ Backend Lint + Schema Validate â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  backend:
    name: Backend â€” Lint & Schema
    runs-on: ubuntu-latest
    # Run in parallel with unit tests â€” both are fast and independent
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://root:password@localhost:3306/halqa_test'

      - name: Check for syntax errors
        run: node -e "
          const files = require('fs').readdirSync('./src', { recursive: true })
            .filter(f => f.endsWith('.js'))
            .map(f => './src/' + f);
          let ok = 0, fail = 0;
          files.forEach(f => {
            try { require(f); ok++; }
            catch(e) { if (!e.message.includes('Cannot find module')) { console.error('FAIL:', f, e.message); fail++; } else ok++; }
          });
          console.log('Syntax check:', ok, 'OK,', fail, 'FAIL');
          if (fail > 0) process.exit(1);
        "
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://root:password@localhost:3306/halqa_test'
          JWT_SECRET: 'test_secret_for_ci_only'
          JWT_REFRESH_SECRET: 'test_refresh_secret_for_ci_only'
          PORT: '5001'

  # â”€â”€â”€ Frontend Type Check + Lint â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend:
    name: Frontend â€” TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Jest unit + PBT tests
        run: npm test -- --ci --reporters=default
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:5000/api/v1'
          NEXT_PUBLIC_SOCKET_URL: 'http://localhost:5000'

  # â”€â”€â”€ Mobile Type Check + Lint â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  mobile:
    name: Mobile â€” TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: mobile

      - name: ESLint
        run: npm run lint
        working-directory: mobile

      - name: Jest unit tests
        run: npm test -- --ci --passWithNoTests --reporters=default
        working-directory: mobile

  # â”€â”€â”€ Backend Integration Tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # REQ-19.3, REQ-20.9: Run integration tests against a real MySQL + Redis.
  # Runs after backend lint and unit tests both pass.
  # Blocks the Docker build if any integration test fails.
  backend-integration:
    name: Backend â€” Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, backend-tests]

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: halqa_test
          MYSQL_USER: halqa
          MYSQL_PASSWORD: halqa_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Prisma migrations against test DB
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'

      - name: Verify no pending migrations (drift detection)
        run: |
          STATUS=$(npx prisma migrate status 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "have not yet been applied"; then
            echo "ERROR: Unapplied migrations detected. Schema and migrations are out of sync."
            echo "Run 'npx prisma migrate dev --name fix_drift' to generate a migration for schema changes."
            exit 1
          fi
          echo "Migration drift check passed â€” database schema is up to date."
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'

      - name: Run integration tests
        run: npm run test:integration -- --ci
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'
          REDIS_URL: 'redis://localhost:6379'
          JWT_SECRET: 'ci_integration_jwt_secret_at_least_32_chars!!'
          JWT_REFRESH_SECRET: 'ci_integration_refresh_secret_32_chars!!'
          PORT: '5002'
          SERVICE_NAME: 'halqa-integration-ci'
          HEALTH_TOKEN: 'ci_health_token_integration_tests_only_!!'
          METRICS_TOKEN: 'ci_metrics_token_integration_tests_only_!!'

      - name: Verify backup and restore procedure
        # Proves that mysqldump + restore works against the test DB.
        # This is the minimal bar for production restore readiness.
        # Steps: dump â†’ drop â†’ recreate â†’ restore â†’ count tables.
        run: |
          echo "=== Step 1: Create backup of test database ==="
          mysqldump -u halqa -phalqa_test_pw halqa_test > /tmp/halqa_test_backup.sql
          echo "Backup size: $(wc -c < /tmp/halqa_test_backup.sql) bytes"

          echo "=== Step 2: Verify backup file is non-empty ==="
          if [ ! -s /tmp/halqa_test_backup.sql ]; then
            echo "ERROR: Backup file is empty"
            exit 1
          fi

          echo "=== Step 3: Drop and recreate the test database ==="
          mysql -u halqa -phalqa_test_pw -e "DROP DATABASE halqa_test; CREATE DATABASE halqa_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          echo "=== Step 4: Restore from backup ==="
          mysql -u halqa -phalqa_test_pw halqa_test < /tmp/halqa_test_backup.sql

          echo "=== Step 5: Verify table count is non-zero ==="
          TABLE_COUNT=$(mysql -u halqa -phalqa_test_pw halqa_test --skip-column-names -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='halqa_test' AND table_type='BASE TABLE';")
          echo "Tables restored: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt "10" ]; then
            echo "ERROR: Restore failed â€” too few tables ($TABLE_COUNT)"
            exit 1
          fi

          echo "=== Backup/restore verification PASSED â€” $TABLE_COUNT tables restored ==="
          rm -f /tmp/halqa_test_backup.sql

  # â”€â”€â”€ Docker Build Test â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    # DO-003: Docker build only runs after lint, unit tests, AND integration tests pass
    needs: [backend, backend-tests, backend-integration, frontend]
    # Only run on main branch or PRs to main (not on every push to develop)
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t halqa-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t halqa-frontend:test ./frontend
        env:
          NEXT_PUBLIC_API_URL: 'https://api.halqa.app/api/v1'
          NEXT_PUBLIC_SOCKET_URL: 'https://api.halqa.app'
          NEXT_PUBLIC_LIVEKIT_URL: 'wss://placeholder.livekit.cloud'

  # â”€â”€â”€ Playwright E2E Tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Runs after the Docker build succeeds (app must build cleanly before E2E).
  # Uses a static mock backend env so tests run deterministically in CI.
  # The frontend is built in standalone mode and served with `next start`.
  e2e:
    name: Frontend â€” Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend-integration]
    # Only run on main or PRs to main â€” E2E is expensive, skip feature branches
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: halqa_test
          MYSQL_USER: halqa
          MYSQL_PASSWORD: halqa_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # â”€â”€ Start backend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy && node src/prisma/seed.js
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'
          NODE_ENV: test

      - name: Start backend server
        run: npm start &
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://halqa:halqa_test_pw@localhost:3306/halqa_test'
          REDIS_URL: 'redis://localhost:6379'
          JWT_SECRET: 'ci_e2e_jwt_secret_at_least_32_chars!!'
          JWT_REFRESH_SECRET: 'ci_e2e_refresh_secret_32_chars!!'
          PORT: '5000'
          CLIENT_URL: 'http://localhost:3000'
          STORAGE_TYPE: 'local'
          SERVICE_NAME: 'halqa-e2e'
          LIVEKIT_URL: 'wss://placeholder.livekit.cloud'
          LIVEKIT_API_KEY: 'ci_placeholder'
          LIVEKIT_API_SECRET: 'ci_placeholder_api_key_only'
          HEALTH_TOKEN: 'ci_health_token_e2e_tests_only_!!'
          METRICS_TOKEN: 'ci_metrics_token_e2e_tests_only_!!'

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/health --timeout 30000

      # â”€â”€ Build and start frontend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:5000/api/v1'
          NEXT_PUBLIC_SOCKET_URL: 'http://localhost:5000'
          NEXT_PUBLIC_LIVEKIT_URL: 'wss://placeholder.livekit.cloud'

      - name: Start frontend server
        run: npm start &
        working-directory: frontend
        env:
          PORT: '3000'

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000

      # â”€â”€ Run Playwright â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:3000'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
