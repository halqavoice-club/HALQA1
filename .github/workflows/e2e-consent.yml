name: Voice Consent E2E

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_mobile:
        description: Run emulator/simulator jobs
        type: boolean
        default: false

concurrency:
  group: consent-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Validate E2E Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          echo "Validating E2E consent secrets..."
          MISSING=""
          
          if [ -z "$LIVEKIT_URL" ]; then
            echo "ERROR: LIVEKIT_URL secret is not set"
            MISSING="$MISSING LIVEKIT_URL"
          fi
          
          if [ -z "$LIVEKIT_API_KEY" ]; then
            echo "ERROR: LIVEKIT_API_KEY secret is not set"
            MISSING="$MISSING LIVEKIT_API_KEY"
          fi
          
          if [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "ERROR: LIVEKIT_API_SECRET secret is not set"
            MISSING="$MISSING LIVEKIT_API_SECRET"
          fi
          
          if [ -z "$E2E_CONSENT_ROOM_URL" ]; then
            echo "ERROR: E2E_CONSENT_ROOM_URL secret is not set"
            MISSING="$MISSING E2E_CONSENT_ROOM_URL"
          fi
          
          if [ -z "$E2E_TEST_API_TOKEN" ]; then
            echo "ERROR: E2E_TEST_API_TOKEN secret is not set"
            MISSING="$MISSING E2E_TEST_API_TOKEN"
          fi

          if [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "ERROR: E2E_TEST_PASSWORD secret is not set"
            MISSING="$MISSING E2E_TEST_PASSWORD"
          fi

          if [ -z "$E2E_TEST_USER_ID" ]; then
            echo "ERROR: E2E_TEST_USER_ID secret is not set"
            MISSING="$MISSING E2E_TEST_USER_ID"
          fi
          
          if [ -n "$MISSING" ]; then
            echo ""
            echo "========================================"
            echo "MISSING SECRETS:$MISSING"
            echo "========================================"
            echo ""
            echo "E2E consent tests CANNOT run without these secrets."
            echo "Add them in Settings > Secrets and variables > Actions."
            echo ""
            exit 1
          fi
          
          echo "✅ All required E2E consent secrets are present."
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          E2E_CONSENT_ROOM_URL: ${{ secrets.E2E_CONSENT_ROOM_URL }}
          E2E_TEST_API_TOKEN: ${{ secrets.E2E_TEST_API_TOKEN }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}

  web-consent:
    needs: [check-secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      livekit:
        image: livekit/livekit-server:v1.9.10
        ports: ['7880:7880', '7881:7881']
        env:
          LIVEKIT_KEYS: "devkey: secret"
      mysql:
        image: mariadb:10.11
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: halqa_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Verify database credentials
        env:
          MYSQL_PWD: test
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "SELECT 1 AS connected;" halqa_test
      
      - name: Run Prisma migrations and seed
        # Seed creates student1@halqa.com (STUDENT) used by the login fixture.
        run: npx prisma migrate deploy && node src/prisma/seed.js
        working-directory: backend
        env:
          DATABASE_URL: 'mysql://root:test@localhost:3306/halqa_test'
          NODE_ENV: test
      
      - name: Start backend server
        run: npm start &
        working-directory: backend
        env:
          NODE_ENV: test
          ENABLE_E2E_TEST_API: 'true'
          E2E_TEST_API_TOKEN: ${{ secrets.E2E_TEST_API_TOKEN }}
          DATABASE_URL: 'mysql://root:test@localhost:3306/halqa_test'
          JWT_SECRET: 'ci_e2e_consent_jwt_secret_32_chars_placeholder!!'
          JWT_REFRESH_SECRET: 'ci_e2e_consent_refresh_32_chars_placeholder!'
          PORT: '5000'
          CLIENT_URL: 'http://localhost:3000'
          STORAGE_TYPE: 'local'
          SERVICE_NAME: 'halqa-e2e-consent'
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          HEALTH_TOKEN: 'ci_health_token_e2e_consent_only!!'
          METRICS_TOKEN: 'ci_metrics_token_e2e_consent_only!!'
          PAYOUT_ENCRYPTION_KEY: 'ci_payout_key_32bytes_placeholder_e2e!!'
          REDIS_URL: ''
      
      - name: Wait for backend health check
        run: npx wait-on http://localhost:5000/health --timeout 30000
      
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - run: npm ci
        working-directory: frontend
      
      - name: Start frontend dev server
        run: npm run dev &
        working-directory: frontend
        env:
          # Use relative NEXT_PUBLIC_API_URL so browser XHR goes through the
          # Next.js rewrite proxy (same origin). This keeps the SameSite=strict
          # httpOnly refresh cookie on the same origin as the page, allowing
          # ClientOnly to call /auth/refresh successfully on mount.
          NEXT_PUBLIC_API_URL: '/api/v1'
          NEXT_PUBLIC_SOCKET_URL: 'http://localhost:5000'
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          BACKEND_URL: 'http://localhost:5000'
          PORT: '3000'
      
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000
      
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      
      - name: Run real consent suite
        run: npx playwright test e2e/voice.spec.ts
        working-directory: frontend
        env:
          CI: 'true'
          E2E_CONSENT_ROOM_URL: ${{ secrets.E2E_CONSENT_ROOM_URL }}
          E2E_TEST_API_TOKEN: ${{ secrets.E2E_TEST_API_TOKEN }}
          E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}
          # Credentials for the real login performed by the consent-setup fixture.
          # student1@halqa.com is created by seed.js which runs before the backend starts.
          E2E_TEST_EMAIL: 'student1@halqa.com'
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-consent-report, path: frontend/playwright-report, if-no-files-found: ignore }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-consent-failures, path: frontend/test-results, if-no-files-found: ignore }

  mobile-android-consent:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
        working-directory: mobile
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          profile: pixel_5
          script: cd mobile && npx detox build --configuration android.emu.debug && npx detox test --configuration android.emu.debug e2e/voice-consent.android.e2e.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: detox-android-consent, path: mobile/e2e/artifacts, if-no-files-found: ignore }

  mobile-ios-consent:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mobile
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
        working-directory: mobile
      - run: npx detox build --configuration ios.sim.debug
        working-directory: mobile
      - run: npx detox test --configuration ios.sim.debug e2e/voice-consent.e2e.ts
        working-directory: mobile
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: detox-ios-consent, path: mobile/e2e/artifacts, if-no-files-found: ignore }

