worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  # Security headers — applied to all responses
  # X-Frame-Options: prevents clickjacking
  # X-Content-Type-Options: prevents MIME sniffing
  # X-XSS-Protection: legacy XSS filter for older browsers
  # Referrer-Policy: controls referrer information
  # Strict-Transport-Security (HSTS): forces HTTPS for 1 year
  #   includeSubDomains: applies to all subdomains
  #   preload: eligible for browser HSTS preload list
  # Content-Security-Policy: restricts resource origins
  #   default-src 'self': only allow same-origin by default
  #   script-src: allow same-origin + inline (needed for Next.js)
  #   style-src: allow same-origin + inline (needed for Tailwind/CSS-in-JS)
  #   img-src: allow same-origin, data URIs, and any HTTPS (for CDN avatars)
  #   connect-src: allow same-origin + WebSocket (for Socket.IO + LiveKit)
  #   font-src: allow same-origin + Google Fonts
  #   frame-ancestors: no embedding in iframes (replaces X-Frame-Options)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  # CSP is set dynamically by Next.js middleware with per-request nonce
  # (see frontend/src/middleware.ts — FE-R-002/003).
  # A static nginx CSP cannot carry the per-request nonce that Next.js generates,
  # so the CSP header must originate from the Next.js middleware layer, not here.
  # Nginx passes the CSP header through to the browser via proxy_pass unchanged.
  # add_header Content-Security-Policy "..." always;   ← intentionally removed
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # DO-002: Rate limit for live/real-time features (voice room join, gift send,
  # live class join). These are high-frequency endpoints during peak usage.
  # 60 requests/min per IP with a burst of 10 covers legitimate activity
  # while blocking automated join/gift floods at the nginx layer.
  limit_req_zone $binary_remote_addr zone=live:10m rate=60r/m;

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Main HTTPS server
  server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — replace with your cert paths
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50M;

    # Frontend (Next.js)
    location / {
      proxy_pass http://halqa-frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://halqa-backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — stricter rate limit
    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://halqa-backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DO-002: Live features rate limiting (voice, gifts, live classes)
    # Applied before the generic /api/ block so it takes precedence.
    location ~ ^/api/v1/(voice|gifts|live-classes|livekit)/ {
      limit_req zone=live burst=10 nodelay;
      proxy_pass http://halqa-backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
      proxy_pass http://halqa-backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Static uploads
    location /uploads/ {
      proxy_pass http://halqa-backend:5000;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # PERF-005: Cache Next.js immutable static assets at the edge.
    # /_next/static/ files are content-hashed (include hash in filename),
    # so they can be cached indefinitely. Cloudflare / any CDN proxy will
    # respect these headers and serve assets from edge nodes.
    location /_next/static/ {
      proxy_pass http://halqa-frontend:3000;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      add_header X-Content-Type-Options "nosniff";
    }

    # Next.js images endpoint — short cache, allow CDN to cache
    location /_next/image {
      proxy_pass http://halqa-frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Health check
    location /health {
      proxy_pass http://halqa-backend:5000;
      access_log off;
    }
  }
}
